name: 功能请求
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 这个需求来自什么场景？现状有什么不足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充
      description: 考虑过的其他做法，或任何补充信息
